name: Release

# One package, one version, so tags are plain: v<version>, e.g. v0.1.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/franca
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) — no API token needed
      contents: write # creating the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Tag must match the version in pyproject.toml
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")"
          if [ "$version" != "$declared" ]; then
            echo "::error::tag version $version does not match pyproject.toml version $declared"
            exit 1
          fi

      - run: uv build --out-dir dist
      - run: uvx twine check dist/*

      # PyPI rejects new files added to a release older than 14 days, so every
      # artifact for a version has to be published here in one shot.
      # Sigstore attestations are generated by default under trusted publishing.
      # The trusted publisher for this repository must be configured on PyPI
      # before the first tag is pushed.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
